AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Learning project: a small VPC network foundation with two public subnets.
  No EC2 instances, NAT gateways, or other continuously running compute
  resources are created by this template.

Parameters:
  EnvironmentName:
    Type: String
    Default: portfolio-lab
    Description: Prefix used for resource names and tags.
    AllowedPattern: "[a-zA-Z0-9-]+"
    ConstraintDescription: Use only letters, numbers, and hyphens.

  SshAllowedCidr:
    Type: String
    Description: >
      Your trusted public IPv4 address in CIDR notation, for example
      198.51.100.25/32. Replace the documentation example before deployment.
    Default: 198.51.100.25/32
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"
    ConstraintDescription: Enter an IPv4 CIDR block such as 203.0.113.10/32.

Resources:
  PortfolioVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"
        - Key: Project
          Value: cloudformation-network-foundation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-igw"

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref PortfolioVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PortfolioVPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PortfolioVPC
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PortfolioVPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-rt"

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restricted SSH access for future lab instances
      VpcId: !Ref PortfolioVPC
      SecurityGroupIngress:
        - Description: SSH only from the administrator's trusted IPv4 CIDR
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshAllowedCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-instance-sg"

Outputs:
  VpcId:
    Description: Created VPC ID
    Value: !Ref PortfolioVPC
  PublicSubnetAId:
    Description: Public subnet in the first Availability Zone
    Value: !Ref PublicSubnetA
  PublicSubnetBId:
    Description: Public subnet in the second Availability Zone
    Value: !Ref PublicSubnetB
  SecurityGroupId:
    Description: Security group with SSH restricted to SshAllowedCidr
    Value: !Ref InstanceSecurityGroup
